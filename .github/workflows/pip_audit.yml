name: Security Audit Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit_packages
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --fix --dry-run --format markdown > pip-audit_report.md

      - name: Run OS-level Runtime Audit (Trivy)
        id: audit_runtime
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '/opt/hostedtoolcache/Python'
          format: 'table'
          output: 'trivy_report.txt'
          exit-code: '1'
        continue-on-error: true

      - name: Create Slack Payload File
        if: always() && (steps.audit_packages.outcome == 'failure' || steps.audit_runtime.outcome == 'failure')
        run: |
          SUMMARY=""
          if [ -f pip-audit_report.md ]; then
            CLEAN_AUDIT=$(cat pip-audit_report.md | \
              sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' | \
              sed 's/--- | --- | --- | ---//g' | \
              sed 's/Name | Version | ID | Fix Versions/PACKAGE   | VERSION | ID                   | FIX VERSION/g')
            SUMMARY="Package Vulnerabilities found:\n$CLEAN_AUDIT\n"
          fi
          if [ -f trivy_report.txt ]; then
            SUMMARY="${SUMMARY}\nPython Vulnerabilities found:\n$(cat trivy_report.txt)"
          fi
          export EXPORT_SUMMARY="$SUMMARY"
          python3 -c '
import json, os
repo = os.environ.get("GITHUB_REPOSITORY", "repo")
summary_data = os.environ.get("EXPORT_SUMMARY", "")
message = f"*Vulnerabilities detected in {repo}* \n\n```\n{summary_data}\n```"
with open("slack_payload.json", "w") as f:
    json.dump({"text": message}, f)
'

      - name: Send Slack Notification
        if: always() && hashFiles('slack_payload.json') != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./slack_payload.json

      - name: Enforce Pipeline Failure
        if: always() && (steps.audit_packages.outcome == 'failure' || steps.audit_runtime.outcome == 'failure')
        run: |
          echo "Vulnerabilities detected. Review Slack notification."
          exit 1
