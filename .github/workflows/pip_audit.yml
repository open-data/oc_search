name: Security Audit Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit_packages
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --fix --dry-run > pip-audit_report.md

      - name: Run OS-level Runtime Audit (Trivy)
        id: audit_runtime
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '/opt/hostedtoolcache/Python'
          format: 'table'
          output: 'trivy_report.txt'
          exit-code: '1'
        continue-on-error: true

      - name: Create Slack Payload File
        if: always() && (steps.audit_packages.outcome == 'failure' || steps.audit_runtime.outcome == 'failure')
        run: |
          SUMMARY=""
          if [ -f pip-audit_report.md ]; then
            SUMMARY="Package Vulnerabilities found: \n$(cat pip-audit_report.md)\n"
          fi
          if [ -f trivy_report.txt ]; then
            SUMMARY="${SUMMARY}\nPython Runtime Vulnerabilities:\n$(cat trivy_report.txt)"
          fi

          jq -n --arg msg "Vulnerabilities detected in *${{ github.repository }}*\n\n\`\`\`\n$SUMMARY\n\`\`\`" \
            '{text: $msg}' > slack_payload.json

      - name: Send Slack Notification
        if: always() && hashFiles('slack_payload.json') != ''
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload-file-path: ./slack_payload.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Enforce Pipeline Failure
        if: always() && (steps.audit_packages.outcome == 'failure' || steps.audit_runtime.outcome == 'failure')
        run: |
          echo "Vulnerabilities detected. Review Slack notification."
          exit 1
